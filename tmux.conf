# tmux.conf — symlinked to ~/.tmux.conf by install.sh
# Self-contained (no TPM). Catppuccin Mocha to match starship. Nerd Font glyphs.

# ── Core behavior ───────────────────────────────────────────────────────────
set -g mouse on                       # scroll wheel = copy-mode scroll, click to select pane/resize by drag
set -g history-limit 50000            # scrollback buffer
set -sg escape-time 0                 # no delay after Esc (matters for neovim)
set -g focus-events on                # let neovim autoread / focus events through
set -g renumber-windows on            # keep window numbers gapless after closing one
set -g window-size latest             # size to most-recent client, not the smallest (avoids a stuck 1-row zombie client squeezing the window)
set -g base-index 1                   # windows start at 1 (0 is far from prefix key)
setw -g pane-base-index 1
set -g set-clipboard on
set -g display-time 2000              # status messages stay 2s
set -g display-panes-time 2000

# truecolor + 256color (assumes outer term sets TERM to a *-256color)
set -g  default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-ghostty:Tc"

# ── Prefix: C-b -> C-a (easier reach). C-a C-a sends literal C-a. ────────────
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ── Keybinds ────────────────────────────────────────────────────────────────
# reload config
bind r source-file ~/.tmux.conf \; display "  tmux.conf reloaded"

# splits: | and - , keep current working dir
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
# new window in cwd
bind c new-window -c "#{pane_current_path}"

# vim-style pane navigation (prefix h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes (prefix + Shift-HJKL, repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# quick window switch (repeatable)
bind -r n next-window
bind -r p previous-window

# ── Copy mode: vi keys + macOS pbcopy ───────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v       send-keys -X begin-selection
bind -T copy-mode-vi y       send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
# scroll wheel speed: 3 lines per notch instead of 5
bind -T copy-mode-vi WheelUpPane   send-keys -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 3 scroll-down

# Wheel in a normal shell pane -> enter copy-mode instead of leaking mouse
# escape codes into zsh's line editor (the "色堆" garbage). Full-screen apps
# (alternate screen, e.g. less/vim) still get the wheel via -M.
bind -n WheelUpPane   if -F "#{?pane_in_mode,1,#{alternate_on}}" "send -M" "copy-mode -e"
bind -n WheelDownPane if -F "#{?pane_in_mode,1,#{alternate_on}}" "send -M" "copy-mode -e"

# ── Catppuccin Mocha palette ────────────────────────────────────────────────
# base #1e1e2e  surface0 #313244  text #cdd6f4  blue #89b4fa
# mauve #cba6f7  green #a6e3a1  peach #fab387  overlay0 #6c7086
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# left: session name in a mauve pill
set -g status-left-length 40
set -g status-left "#[bg=#cba6f7,fg=#1e1e2e,bold]  #S #[bg=#1e1e2e,fg=#cba6f7]#[default] "

# right: date + time
set -g status-right-length 80
set -g status-right "#[fg=#6c7086]#{?client_prefix,#[fg=#fab387]󰮯 PREFIX ,}#[fg=#89b4fa]󰃭 %a %d %b #[fg=#6c7086]│ #[fg=#a6e3a1]󰥔 %H:%M "

# windows
setw -g window-status-format         "#[fg=#6c7086] #I #W "
setw -g window-status-current-format "#[bg=#313244,fg=#89b4fa,bold] #I #W #[default]"
setw -g window-status-separator ""

# panes
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# messages / command line
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#89b4fa,fg=#1e1e2e"  # copy-mode selection highlight
