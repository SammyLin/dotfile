# ghostty <-> herdr key routing
#
# Included from `ghostty-config` (last line). Comment out that `config-file`
# line to get plain Ghostty tabs/splits back.
#
# How it works: herdr listens on the ctrl+b prefix (\x02). Each binding types
# "\x02<key>" into the pane, which herdr's prefix mode consumes. The `unbind`
# twins are required because macOS/Ghostty would otherwise swallow the chord
# (cmd+w closing the window) before herdr ever sees it -- `key_t`/`digit_1` are
# the *physical* key forms, which is what actually reaches the pane.
#
# Ghostty has no trailing comments. A `#` after a value lands *inside* the
# value, so every comment here sits on its own line.
#
# Caveat: while this is active, cmd+t/w/d no longer make *Ghostty* tabs or
# splits. Native equivalents live on ctrl+cmd+* at the bottom.

# --- tabs -------------------------------------------------------------------
# cmd+t new tab
keybind = cmd+key_t=text:\x02c
keybind = cmd+t=unbind
# cmd+shift+w close tab
keybind = cmd+shift+key_w=text:\x02X
keybind = cmd+shift+w=unbind
# cmd+shift+t rename tab
keybind = cmd+shift+key_t=text:\x02T
keybind = cmd+shift+t=unbind
# cmd+alt+left / right cycle tabs
keybind = cmd+alt+left=text:\x02p
keybind = cmd+alt+right=text:\x02n

# --- workspaces -------------------------------------------------------------
# cmd+n new workspace
keybind = cmd+key_n=text:\x02N
keybind = cmd+n=unbind
# cmd+shift+n rename workspace
keybind = cmd+shift+key_n=text:\x02W
keybind = cmd+shift+n=unbind
# cmd+p workspace picker
keybind = cmd+key_p=text:\x02w
keybind = cmd+p=unbind

# --- panes ------------------------------------------------------------------
# cmd+d split vertical
keybind = cmd+key_d=text:\x02v
keybind = cmd+d=unbind
# cmd+shift+d split horizontal
keybind = cmd+shift+key_d=text:\x02-
keybind = cmd+shift+d=unbind
# cmd+w close pane
keybind = cmd+key_w=text:\x02x
keybind = cmd+w=unbind
# cmd+enter zoom pane
keybind = cmd+enter=text:\x02z
# cmd+alt+hjkl focus pane
# the unbind twins kill ghostty-config's own cmd+alt+hjkl=goto_split -- those are
# bound on the *logical* key, a different trigger from key_h, so without these
# both bindings stay live and Ghostty's split-focus wins (and does nothing,
# since herdr owns the panes)
keybind = cmd+alt+key_h=text:\x02h
keybind = cmd+alt+h=unbind
keybind = cmd+alt+key_j=text:\x02j
keybind = cmd+alt+j=unbind
keybind = cmd+alt+key_k=text:\x02k
keybind = cmd+alt+k=unbind
keybind = cmd+alt+key_l=text:\x02l
keybind = cmd+alt+l=unbind
# cmd+alt+r resize mode
keybind = cmd+alt+key_r=text:\x02r

# --- cmd+1..9 jump to tab ---------------------------------------------------
# bound on the physical digits, otherwise Ghostty's own goto_tab wins
keybind = cmd+digit_1=text:\x021
keybind = cmd+digit_2=text:\x022
keybind = cmd+digit_3=text:\x023
keybind = cmd+digit_4=text:\x024
keybind = cmd+digit_5=text:\x025
keybind = cmd+digit_6=text:\x026
keybind = cmd+digit_7=text:\x027
keybind = cmd+digit_8=text:\x028
keybind = cmd+digit_9=text:\x029
keybind = cmd+1=unbind
keybind = cmd+2=unbind
keybind = cmd+3=unbind
keybind = cmd+4=unbind
keybind = cmd+5=unbind
keybind = cmd+6=unbind
keybind = cmd+7=unbind
keybind = cmd+8=unbind
keybind = cmd+9=unbind

# --- cmd+shift+1..5 jump to workspace ---------------------------------------
# pairs with switch_workspace = "prefix+shift+1..9" in herdr config.toml
keybind = cmd+shift+digit_1=text:\x02!
keybind = cmd+shift+digit_2=text:\x02@
keybind = cmd+shift+digit_3=text:\x02#
keybind = cmd+shift+digit_4=text:\x02$
keybind = cmd+shift+digit_5=text:\x02%

# --- the ones that matter when you forget the rest --------------------------
# cmd+/ herdr keybind help overlay
keybind = cmd+slash=text:\x02?
# cmd+, herdr settings
keybind = cmd+comma=text:\x02s
# cmd+b toggle sidebar
keybind = cmd+key_b=text:\x02b
keybind = cmd+b=unbind
# cmd+shift+q detach from the session (it keeps running)
keybind = cmd+shift+q=text:\x02q

# --- escape hatches: real Ghostty tabs and splits ---------------------------
keybind = ctrl+cmd+t=new_tab
keybind = ctrl+cmd+w=close_surface
keybind = ctrl+cmd+d=new_split:right

# cmd+shift+/ herdr cheatsheet popup
keybind = cmd+shift+slash=text:\x02K

# cmd+alt+up / down cycle herdr workspaces (spaces)
keybind = cmd+alt+up=text:\x02\x1b[A
keybind = cmd+alt+down=text:\x02\x1b[B
